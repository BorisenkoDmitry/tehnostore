name: texno-medusa

x-app: &app
  image: texno-medusa-dev:local
  build: .
  init: true
  environment:
    NODE_ENV: development
    MEDUSA_DISABLE_TELEMETRY: "true"
    NEXT_TELEMETRY_DISABLED: "1"
    CHOKIDAR_USEPOLLING: "true"
    DATABASE_URL: postgresql://medusa_app:${MEDUSA_DB_PASSWORD}@postgres:5432/texno_medusa
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET}
    COOKIE_SECRET: ${COOKIE_SECRET}
    STORE_CORS: http://localhost:8000,http://127.0.0.1:8000
    ADMIN_CORS: http://localhost:9000,http://localhost:5173,http://127.0.0.1:9000
    AUTH_CORS: http://localhost:8000,http://localhost:9000,http://localhost:5173,http://127.0.0.1:8000,http://127.0.0.1:9000
  volumes:
    - ./apps/backend/src:/server/apps/backend/src
    - ./apps/backend/medusa-config.ts:/server/apps/backend/medusa-config.ts:ro
    - ./apps/storefront/src:/server/apps/storefront/src
    - ./apps/storefront/public:/server/apps/storefront/public

services:
  admin-setup:
    <<: *app
    profiles: ["tools"]
    working_dir: /server/apps/backend
    command: ["node", "/setup/create-admin.cjs"]
    volumes:
      - ./docker:/setup:ro
      - ./.local:/credentials:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: texno_medusa
      POSTGRES_USER: texno_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      MEDUSA_DB_PASSWORD: ${MEDUSA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-database.sh:/docker-entrypoint-initdb.d/10-medusa.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U texno_bootstrap -d texno_medusa"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *app
    restart: unless-stopped
    working_dir: /server/apps/backend
    command: ["pnpm", "dev"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

  storefront:
    <<: *app
    restart: unless-stopped
    working_dir: /server/apps/storefront
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      MEDUSA_INTERNAL_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_DEFAULT_REGION: dk
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
    command: ["pnpm", "dev", "--webpack", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
