user nginx;
worker_processes auto;
# Nginx error messages append the raw request URI (including capabilities).
# Keep safe upstream failures in the access record below instead.
error_log /dev/null crit;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format safe_json escape=json '{"method":"$request_method","surface":"$safe_surface","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream_status":"$upstream_status"}';
  map $uri $safe_surface {
    default storefront;
    ~^/store(/|$) store;
    ~^/admin(/|$) admin;
    ~^/auth(/|$) auth;
    ~^/app(/|$) app;
    ~^/static(/|$) media;
  }
  access_log /var/log/nginx/access.log safe_json;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  map $forwarded_proto $forwarded_port {
    default 80;
    https 443;
  }

  server {
    listen 80;
    server_name _;
    set $backend http://backend:9000;
    set $storefront http://storefront:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~ ^/(store|admin|auth|app|static|uploads|health)(/|$) {
      proxy_pass $backend;
    }

    location / {
      proxy_buffering off;
      proxy_pass $storefront;
    }
  }
}
