user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  map $forwarded_proto $forwarded_port {
    default 80;
    https 443;
  }

  server {
    listen 80;
    server_name tehnostore.dmitriy-borisenko.ru;
    set $backend http://backend:9000;
    set $storefront http://storefront:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~ ^/(store|admin|auth|app|static|uploads|health)(/|$) {
      proxy_pass $backend;
    }

    location / {
      proxy_buffering off;
      proxy_pass $storefront;
    }
  }
}
