events {}
error_log /dev/null crit;
http {
  log_format safe_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","surface":"$safe_surface","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"upstream_status":"$upstream_status"}';
  map $uri $safe_surface {
    default storefront;
    ~^/store(/|$) store;
    ~^/admin(/|$) admin;
    ~^/auth(/|$) auth;
    ~^/__qa_ qa-probe;
  }
  access_log /dev/stdout safe_json;
  server {
    listen 9000;
    add_header X-QA-Request-ID $request_id always;
    # Only the sealed QA gateway has this controlled upstream-failure probe.
    location = /__qa_error_probe {
      proxy_pass http://127.0.0.1:9;
    }
    location / {
      proxy_pass http://backend:9000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Request-ID $request_id;
    }
  }
  server {
    listen 5173;
    location / {
      proxy_pass http://backend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
  server {
    listen 8000;
    location / {
      proxy_pass http://storefront:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
